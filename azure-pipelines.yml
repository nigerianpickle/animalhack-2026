# Invoice Project — CI/CD Pipeline
# Build -> Test -> Deploy QA (auto) -> Manual Approval -> Deploy Prod

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: 'Default'   # TODO: confirm actual self-hosted pool name with Alexander James

variables:
  pythonVersion: '3.11'
  artifactName: 'invoice-app'

stages:

  # ---------------------------------------------------------------------
  # Stage 1 — Build (install dependencies, package the app)
  # ---------------------------------------------------------------------
  - stage: Build
    displayName: 'Build'
    jobs:
      - job: BuildApp
        displayName: 'Install & Package'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Set Python version'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install dependencies'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
              replaceExistingArchive: true
            displayName: 'Package app'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: '$(artifactName)'
            displayName: 'Publish build artifact'

  # ---------------------------------------------------------------------
  # Stage 2 — Automated Tests (its own visible gate; nothing deploys
  # unless this passes)
  # ---------------------------------------------------------------------
  - stage: Test
    displayName: 'Automated Tests'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: RunTests
        displayName: 'Run pytest suite'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Set Python version'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest pytest-azurepipelines
            displayName: 'Install dependencies + test tools'

          - script: |
              pytest --junitxml=$(System.DefaultWorkingDirectory)/test-results.xml
            displayName: 'Run tests'

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(System.DefaultWorkingDirectory)/test-results.xml'
            displayName: 'Publish test results'

  # ---------------------------------------------------------------------
  # Stage 3 — Deploy to QA (auto, runs only on main after Test succeeds)
  # ---------------------------------------------------------------------
  - stage: DeployQA
    displayName: 'Deploy to QA'
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployQA
        displayName: 'Deploy to Invoice QA App Service'
        environment: 'invoice-qa'   # no approval check on this one
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'price_inv_sp_qa_deploy'
                    appType: 'webAppLinux'
                    appName: '<invoice-app-qa-service-name>'      # TODO: fill in actual App Service name
                    package: '$(Pipeline.Workspace)/$(artifactName)/$(artifactName).zip'

  # ---------------------------------------------------------------------
  # Stage 4 — Deploy to Prod (manual approval gate lives on the
  # 'invoice-prod' Environment, not in this file)
  # ---------------------------------------------------------------------
  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: DeployQA
    condition: succeeded()
    jobs:
      - deployment: DeployProd
        displayName: 'Deploy to Invoice Prod App Service'
        environment: 'invoice-prod'   # approval check configured here
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'price_inv_sp_prod_deploy'
                    appType: 'webAppLinux'
                    appName: '<invoice-app-prod-service-name>'    # TODO: fill in actual App Service name
                    package: '$(Pipeline.Workspace)/$(artifactName)/$(artifactName).zip'
